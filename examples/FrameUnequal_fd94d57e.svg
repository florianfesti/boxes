<dc:title>Misc - Frame</dc:title>
<dc:source>boxes Frame --outside=1 --x=200 --y=160 --top=40 --bottom=25 --left=20 --right=15 --joint=none</dc:source>
<dc:description>Flat frame or trim made of up to four mitred bars


